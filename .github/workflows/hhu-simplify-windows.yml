name: HHU Windows (simplify)

# Simplified-edition build of the HHU garlic seeder ground station (QGroundControl + custom/),
# built from the simplify-work-flow branch only — independent of the main HHU Windows workflow
# (hhu branch / hhu-v* tags). No merge into hhu is needed.
# - every push to simplify-work-flow / manual run: installer uploaded as a workflow artifact AND
#   attached to the rolling prerelease tagged hhu-simplify-latest (previous prerelease replaced).
#
# Reuses QGroundControl's own composite actions (.github/actions) for Qt, CMake and the NSIS installer.

on:
  push:
    branches:
      - simplify-work-flow
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  build:
    name: Build Windows x64 installer (simplify)
    runs-on: windows-2022
    timeout-minutes: 150

    defaults:
      run:
        shell: cmd

    outputs:
      installer: ${{ steps.installer.outputs.name }}
      version: ${{ steps.installer.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup (Qt, ccache, MSVC)
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          extra-args: >-
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF
            -DQGC_CUSTOM_DIR=custom

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create installer (NSIS)
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${{ runner.temp }}\build" -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Installer .exe not found"; exit 1 }
          $cm = Get-Content "custom/CMakeLists.txt" -Raw
          $appver = if ($cm -match 'HHU_APP_VERSION "([^"]+)"') { $Matches[1] } else { "0.0.0" }
          $version = "simplify-v$appver-b${{ github.run_number }}"
          $name = "HHU-GCS-$version-Windows-x64-setup.exe"
          Copy-Item $exe.FullName (Join-Path "${{ runner.temp }}" $name)
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$(Join-Path "${{ runner.temp }}" $name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer: $name ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      - name: Silent install test
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}\hhu-install-test"
          Start-Process -FilePath "${{ steps.installer.outputs.path }}" -ArgumentList "/S", "/D=$dir" -Wait -NoNewWindow
          $bin = Get-ChildItem -Path $dir -Recurse -Filter "HHU-GCS.exe" | Select-Object -First 1
          if (-not $bin) { Get-ChildItem -Path $dir -Recurse | Select-Object -First 50 FullName; Write-Error "HHU-GCS.exe not installed"; exit 1 }
          $cfg = Join-Path $bin.DirectoryName "config\hhu_config.json"
          if (-not (Test-Path $cfg)) { Write-Error "config\hhu_config.json missing next to the executable"; exit 1 }
          Write-Host "Installed: $($bin.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish simplified prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: hhu-simplify-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.installer }}
          path: dist

      - name: Remove previous rolling prerelease (release + tag)
        run: gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 无人车地面站 简化版 ${{ needs.build.outputs.version }}
          prerelease: true
          files: dist/*.exe
          body: |
            无人车地面站 **简化版** Windows 安装包（预发布，滚动更新，基于 QGroundControl v5.1.4）。

            **v1.2.3 改动**（issue #7，电量自动显示）
            - 底盘上报电量（VCU_SOC，车上收到 VCU HealthSta 时才有）时顶栏显示电量项，3 秒没有电量数据自动隐藏、不占位
            - 电量详情：电量、电压（超量程显示“—”）、告警阈值；只用底盘 VCU 数据，不用飞控自身电池
            - 低电量告警（默认 20%，高级设置可改）只在有电量数据时判断，数据断了立即撤销
            - 断开、换车、重连时清空电量，不保留上一辆车的旧值

            **v1.2.2 改动**（本期收尾：开到这里、手工排航点作业）
            - 航线速度：默认取车上 WP_SPEED，上限取 SPEED_MAX / VCU_V_MAX 较小值（向下取到 0.05），步进 0.05、两位小数；上传时航线总带速度命令
            - 开到这里：发指令前按与开始作业相同的原因检查（底盘通信、故障、未授权、未就绪、定位），不满足直接说明原因，不解锁、不切模式；到达后显示 100%
            - “返回起点”本期隐藏（config/hhu_config.json 的 features.returnHome 可打开）；车端脚本异常（VCU: error）有中文提示
            - 规划页：去掉“删除第 N 点”“撤销上一点”，改为右键或长按航点弹“第 N 点 · 取消 / 删除”卡片（也可选中后按 Delete）；点地图总是加在最后，每段线中点都有“+”可插点
            - 规划页：上传后显示“已上传到车”；切步骤回到顶部；默认窗口不用滚动；清空后家仍在车的位置
            - 作业页：“找车”可用；点航点不再弹“设置航点”
            - 4G 车辆不在线、正在重试时，切换到其它连接不再弹“断开并连接”确认

            **v1.2.1 改动**（issue #6，界面清理）
            - “暂时不能开始”按优先级给原因：底盘通信中断时提示检查 CAN 线和 VCU，不再提示切无人
            - 去掉地图中间的启动前检查灰框和顶部黄色横幅；铃铛只显示有中文翻译的车端提示，其余只写日志
            - 不再弹出英文的 “Configuration tasks remain” 对话框，弹窗标题不再显示 HHU-GCS
            - 参数下载不再盖住顶栏，改为“正在同步 xx%”和顶栏下方细进度条
            - 全部文字统一为卡片正文字号并跟随“字号”设置；确认框统一为“取消 / 动作”按钮，退出框为“退出 / 取消”
            - 新增 4G 连接缺项时明确提示；同时只连一台车，连接新车前先问是否断开当前连接
            - 规划页：清空前确认且不改速度；速度可直接输入，范围 0.1 m/s ~ 车上 WP_SPEED / VCU_V_MAX；
              可删除任意一个航点；航点编号从 1 开始（不再被改速度指令占号）；点面板不再误加航点
            - 地图设置中文显示；语音全部中文播报；安装程序中文、去掉 QGroundControl 图标和字样
            - 右滑确认必须真正拖动才生效

            **v1.2.0 改动**
            - 移除电量 / 电压显示、低电量告警和设置页的低电量阈值（issue #5：飞控独立供电，VCU 未必上报电池数据，之前会误报“电量低 0%”）；同时关闭 QGC 自带的电池语音播报
            - 软件名改为“无人车地面站”（窗口标题、关于页、安装程序、开始菜单）；安装目录和保存的设置不变，覆盖安装后 4G 连接、差分账号仍在
            - 临时目录无法创建单实例锁文件时不再误报“已有实例在运行”

            - 来源分支：`simplify-work-flow`，提交 ${{ github.sha }}，构建 #${{ github.run_number }}
            - 简化内容：作业控制流程简化（Nav v1.0 授权闸门适配：开始/继续合并为单入口、断点续作、未授权状态引导）
            - 非正式发布渠道：与 `hhu` 分支及 `hhu-v*` 正式 Release 互不干扰；每次推送本分支自动构建并替换本预发布

            安装后在 设置 → 地图 中填写天地图 **浏览器端** Key（程序不内置 Key）。
            车端提示翻译表、差分服务商预设在安装目录的 `bin/config/hhu_config.json`，可直接修改。
